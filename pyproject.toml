[project]
name = "crewai_agent_sale"
version = "0.1.0"
description = "Sale agent: dự báo doanh số và nhân lực bán hàng cho chiến dịch (CrewAI crew + A2A server)"
authors = [{ name = "fenixdo", email = "fenix@torilab.ai" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[a2a]==1.15.27",
    "pyyaml>=6",
]

[project.scripts]
crewai_agent_sale = "crewai_agent_sale.main:run"
run_crew = "crewai_agent_sale.main:run"
train = "crewai_agent_sale.main:train"
replay = "crewai_agent_sale.main:replay"
test = "crewai_agent_sale.main:test"
run_with_trigger = "crewai_agent_sale.main:run_with_trigger"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "38b3177e-c847-4aa7-baaf-d22c3765fe86"
